<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICU Lookin Barber Launcher</title><link rel="icon" href="assets/icons/will.png"><style>:root{--red:#ed1c24;--blue:#173f9e;--ink:#111;--bg:#f4f1eb;--panel:#fff;--line:#d5cec2}*{box-sizing:border-box}body{margin:0;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:820px;margin:auto}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover}.brand h1{margin:0;font-size:1.45rem}.brand p{margin:.3rem 0 0;color:#666}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card,.button,button{display:block;width:100%;padding:18px;border:0;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-weight:900;font-size:16px;cursor:pointer;text-align:left}.card small{display:block;font-weight:600;opacity:.78;margin-top:.35rem}.client{background:var(--red)}.barber{background:#111}.owner{background:var(--blue)}.secondary{background:#555}.danger{background:#851b1b}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{width:auto}dialog{width:min(94vw,560px);border:0;border-radius:18px;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.38)}dialog::backdrop{background:rgba(0,0,0,.65)}.modal{padding:22px}.modal h2{margin-top:0}.field{display:grid;gap:6px;margin:12px 0}.field input{width:100%;padding:14px;border:1px solid #999;border-radius:9px;font-size:16px}.check{display:flex;gap:9px;align-items:flex-start;margin:14px 0}.status{min-height:1.4em;color:#8b1e1e;font-weight:800}.policy-layout{display:grid;grid-template-columns:220px 1fr;gap:14px;height:min(62vh,520px)}.policy-buttons{overflow:auto;display:grid;align-content:start;gap:6px}.policy-buttons button{padding:11px;background:#444}.policy-text{overflow:auto;border:1px solid var(--line);border-radius:12px;padding:14px}.policy-text h3{margin-top:0}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:1fr}.policy-layout{grid-template-columns:1fr;grid-template-rows:180px 1fr}.actions>*{width:100%}}</style></head><body><main><div class="brand"><img src="assets/icu-lookin-logo.jpeg" alt="ICU Lookin logo"><div><h1>Barber Launcher</h1><p>Select your name to enter your private barber workspace.</p></div></div><div class="grid"><button class="card barber" data-barber="Mike">Mike Barber App<small>Private barber workspace</small></button><button class="card barber" data-barber="Will">Will Barber App<small>Private barber workspace</small></button><button class="card barber" data-barber="Henry">Henry Barber App<small>Private barber workspace</small></button><button class="card barber" data-barber="Mon">Mon Barber App<small>Private barber workspace</small></button><button class="card barber" data-barber="Kody">Kody Barber App<small>Private barber workspace</small></button><button class="card barber" data-barber="Selena">Selena Barber App<small>Private barber workspace</small></button><a class="card secondary" href="index.html">Return to Test Hub<small>Exit barber testing</small></a></div><section class="panel"><strong>Authentication test mode</strong><p>Passwords and remembered-device settings are stored only in this browser during GitHub testing. Production authentication will move to Supabase.</p></section></main>
<dialog id="authDialog"><form class="modal" id="authForm"><h2 id="authTitle">Barber Sign In</h2><p id="authText"></p><label class="field">Password<input id="authPassword" type="password" autocomplete="current-password"></label><label id="confirmWrap" class="field">Confirm password<input id="authConfirm" type="password" autocomplete="new-password"></label><label class="check"><input id="rememberDevice" type="checkbox"><span><strong>Remember this device</strong><br><small>Skip the password prompt for this barber on this device until Sign Out.</small></span></label><p id="authStatus" class="status"></p><div class="actions"><button class="button barber" type="submit" id="authSubmit">Continue</button><button class="button secondary" type="button" id="authCancel">Exit / Return to Barber Launcher</button></div></form></dialog>
<script>
const BARBERS=["Mike", "Will", "Henry", "Mon", "Kody", "Selena"],$=id=>document.getElementById(id);let selected="";const passKey=b=>`icuBarberPasswordHash:${b}`,rememberKey=b=>`icuBarberRemembered:${b}`,sessionKey=b=>`icuBarberAuth:${b}`;
async function hashPassword(value){if(window.crypto?.subtle){const data=new TextEncoder().encode(value),buf=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,"0")).join("")}let h=0;for(const c of value)h=((h<<5)-h+c.charCodeAt(0))|0;return String(h)}
function openApp(b){sessionStorage.setItem(sessionKey(b),"1");sessionStorage.setItem("icuAppMode","individual");sessionStorage.setItem("icuBarberName",b);location.href=`${b.toUpperCase()}_BARBER_APP.html`}
function begin(b){selected=b;$("authStatus").textContent="";$("authPassword").value="";$("authConfirm").value="";$("rememberDevice").checked=localStorage.getItem(rememberKey(b))==="1";const has=Boolean(localStorage.getItem(passKey(b)));if(has&&localStorage.getItem(rememberKey(b))==="1"){openApp(b);return}$("authTitle").textContent=has?`${b} — Sign In`:`${b} — Create Password`;$("authText").textContent=has?"Enter your barber password to continue.":"First login: create a password for your barber app. Use at least 6 characters.";$("confirmWrap").style.display=has?"none":"grid";$("authPassword").autocomplete=has?"current-password":"new-password";$("authDialog").showModal();setTimeout(()=>$("authPassword").focus(),50)}
document.querySelectorAll("[data-barber]").forEach(b=>b.onclick=()=>begin(b.dataset.barber));$("authCancel").onclick=()=>$("authDialog").close();$("authForm").onsubmit=async e=>{e.preventDefault();const pwd=$("authPassword").value,stored=localStorage.getItem(passKey(selected));if(!stored){if(pwd.length<6){$("authStatus").textContent="Use at least 6 characters.";return}if(pwd!==$("authConfirm").value){$("authStatus").textContent="The passwords do not match.";return}localStorage.setItem(passKey(selected),await hashPassword(pwd))}else if(await hashPassword(pwd)!==stored){$("authStatus").textContent="Incorrect password.";return}if($("rememberDevice").checked)localStorage.setItem(rememberKey(selected),"1");else localStorage.removeItem(rememberKey(selected));openApp(selected)};
const requested=new URLSearchParams(location.search).get("barber");if(BARBERS.includes(requested))setTimeout(()=>begin(requested),0);
</script></body></html>
